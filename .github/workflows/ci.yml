name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Installs the Zig version pinned in mise.toml, the same one used
      # locally. The action is pinned by commit; bump both lines together.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.6

      - run: zig version
      - run: zig fmt --check build.zig build.zig.zon src examples tests bench
      - run: zig build test --summary all
      - run: zig build test -Doptimize=ReleaseSafe --summary all
      - run: zig build test -Doptimize=ReleaseFast --summary all
      - run: zig build examples
      - run: zig build run
      - run: zig build bench -Dbench-max=10000
      - run: zig build docs
      # The first real consumer: a small editor built on the public API only.
      - run: zig build test --summary all
        working-directory: apps/geo
      - run: zig build run
        working-directory: apps/geo
